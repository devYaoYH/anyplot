[project]
name = "sanctum-mcp"
version = "0.1.0"
description = "Privacy-preserving MCP layer for Sanctum"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sanctum_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
