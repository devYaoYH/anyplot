<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Overlapping circles with blend mode -->
  <g opacity="0.75" style="mix-blend-mode: multiply;">
    <!-- Blue circle (top - larger and offset left) -->
    <circle cx="42" cy="32" r="26" fill="#6a8fae"/>
    <circle cx="42" cy="32" r="32" fill="#6a8fae" opacity="0.3"/>

    <!-- Amber circle (left) -->
    <circle cx="30" cy="58" r="22" fill="#c49652"/>
    <circle cx="30" cy="58" r="28" fill="#c49652" opacity="0.3"/>

    <!-- Purple circle (bottom center) -->
    <circle cx="52" cy="68" r="22" fill="#7c6faa"/>
    <circle cx="52" cy="68" r="28" fill="#7c6faa" opacity="0.3"/>

    <!-- Green circle (right) -->
    <circle cx="70" cy="52" r="22" fill="#6a9e78"/>
    <circle cx="70" cy="52" r="28" fill="#6a9e78" opacity="0.3"/>
  </g>
</svg>
